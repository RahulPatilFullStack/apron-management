services:
  postgres:
    image: postgres:16
    container_name: apron_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apron
      POSTGRES_PASSWORD: apron
      POSTGRES_DB: apron_management
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apron -d apron_management']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
