<article
  class="cursor-pointer rounded-xl border border-slate-200 bg-white p-4 transition
    hover:-translate-y-px hover:border-blue-200 hover:shadow-md focus-visible:border-blue-600"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Open flight plan ' + displayCallsign()"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
>
  <header class="mb-3 flex items-center justify-between gap-2">
    <span class="text-[0.95rem] font-semibold tracking-tight">{{ displayCallsign() }}</span>
    <span class="badge" [class]="typeClass()">{{ flightPlan().flightPlanType }}</span>
  </header>

  <div class="mb-4 flex items-center gap-2 font-mono text-[0.86rem]">
    <span>{{ flightPlan().adep || '—' }}</span>
    <svg class="shrink-0 text-slate-300" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <path
        d="M4 12h15m0 0-5-5m5 5-5 5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>{{ flightPlan().ades || '—' }}</span>
  </div>

  <footer class="flex items-center justify-between text-xs text-slate-500">
    <span>{{ flightPlan().originDate }}</span>
    @if (relevantTime()) {
      <span class="inline-flex items-center gap-1 font-mono text-slate-600">
        <span class="font-sans text-[0.68rem] font-bold text-slate-400">{{ relevantTimeLabel() }}</span>
        {{ relevantTime() | date: 'HH:mm' }}
      </span>
    }
  </footer>
</article>
